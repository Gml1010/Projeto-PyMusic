<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PyMusic{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #030303; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .navbar { background-color: #030303; border-bottom: 1px solid #333; }
        .navbar-brand { font-size: 1.5rem; }
        .nav-link { color: #b3b3b3 !important; font-weight: 500; }
        .nav-link.active { color: #ffffff !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-play-circle-fill text-danger me-2"></i>PyMusic
            </a>
    </nav>
    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
